services:
  - type: web
    name: fullbright-lp
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Full Bright Indonesia
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: id
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: CLIENT_ID
        value: fullbright-indonesia
      - key: PROJECT_MODE
        value: ctwa
      - key: PAYMENT_MODE
        value: none
      - key: WHATSAPP_NUMBER
        value: "6285255499299"
      - key: WHATSAPP_DEFAULT_MESSAGE
        value: Halo Admin Full Bright Indonesia. Saya minat mau daftar kelas TOEFL.
